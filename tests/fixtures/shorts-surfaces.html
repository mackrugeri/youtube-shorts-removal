<!doctype html>
<title>Shorts surface fixtures</title>
<ytd-masthead><div id="center"><input aria-label="Search"><button id="voice-search">Voice search</button></div></ytd-masthead>
<ytd-rich-section-renderer id="shelf">
  <h2>Shorts</h2>
  <ytd-reel-shelf-renderer><a href="/shorts/abc">Short</a></ytd-reel-shelf-renderer>
</ytd-rich-section-renderer>
<grid-shelf-view-model id="mixed">
  <ytd-rich-item-renderer id="short-card"><a href="/shorts/abc">Short</a></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="normal-card"><a href="/watch?v=normal">Video</a></ytd-rich-item-renderer>
</grid-shelf-view-model>
<ytd-guide-entry-renderer id="short-guide"><a href="/shorts">Shorts</a></ytd-guide-entry-renderer>
<ytd-guide-entry-renderer id="normal-guide"><a href="/feed/subscriptions">Subscriptions</a></ytd-guide-entry-renderer>
<ytd-mini-guide-entry-renderer id="mini-shorts"><a href="/shorts/?feature=guide#feed">Shorts</a></ytd-mini-guide-entry-renderer>
<yt-guide-entry-view-model id="modern-shorts"><a href="https://www.youtube.com/shorts?feature=guide">Shorts</a></yt-guide-entry-view-model>
<yt-mini-guide-entry-view-model id="modern-mini-shorts"><a href="/shorts">Shorts</a></yt-mini-guide-entry-view-model>
<ytd-rich-item-renderer id="sponsored-card">
  <ytd-ad-slot-renderer><h3>Sponsored hosting</h3><button>Visit site</button></ytd-ad-slot-renderer>
</ytd-rich-item-renderer>
<ytd-video-renderer id="sponsored-search">
  <a href="/watch?v=sponsored">Ad result</a><yt-ad-badge-view-model>Sponsored</yt-ad-badge-view-model>
</ytd-video-renderer>
<div id="masthead-ad">Banner ad</div>
<div id="player-ads">Companion ad</div>
<ytd-rich-section-renderer id="premium-promo-section">
  <ytd-statement-banner-renderer><a href="/premium">Get a Premium family plan</a></ytd-statement-banner-renderer>
</ytd-rich-section-renderer>
<ytd-rich-section-renderer id="mixed-promo-section">
  <ytd-banner-promo-renderer id="mixed-premium-banner">Try Premium</ytd-banner-promo-renderer>
  <ytd-rich-item-renderer id="normal-promo-neighbor"><a href="/watch?v=normalNeighbor">Ordinary video</a></ytd-rich-item-renderer>
</ytd-rich-section-renderer>
<ytd-rich-item-renderer id="organic-sponsor-title">
  <h3><a href="/watch?v=organic">How sponsored advertising works</a></h3>
</ytd-rich-item-renderer>
<div id="movie_player" class="ad-showing">
  <video id="ordinary-player"></video>
  <button class="ytp-skip-ad-button" onclick="this.parentElement.classList.remove('ad-showing');this.parentElement.dataset.skipped='true'">Skip ad</button>
</div>
